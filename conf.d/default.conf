# ---------- upstreams ----------
upstream oauth2_upstream {
	server oauth2-proxy:4180;
}

# ---------- WebSocket support ----------
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# ---------- HTTP / HTTPS configuration ----------
# Port 80 is useful for quick local testing, while port 443 is always enabled
# using the default self-signed certs baked into the image.
server {
	listen 80;
	listen 443 ssl;
	
	# These default files are generated by the Dockerfile, and can be
	# overwritten by bind mounts for real deployments.
	ssl_certificate     /etc/tls.crt;
	ssl_certificate_key /etc/tls.key;
	
	# Allow large uploads
	client_max_body_size 1g;
	
	# Always tell upstreams the original scheme/host/client IP
	proxy_set_header Host               $host;
	proxy_set_header X-Real-IP          $remote_addr;
	proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Host   $host;
	proxy_set_header X-Forwarded-Proto  $scheme;
	
	# MCP authenticates each client using its xyOps API key. Keep this exact
	# route outside browser SSO, preserving Authorization instead of $authz.
	location = /mcp {
		auth_request off;
		proxy_pass http://backend;
		proxy_http_version 1.1;
		
		# Defining any proxy_set_header here replaces the inherited header set,
		# so repeat the forwarding headers as well as the client's Bearer token.
		proxy_set_header Host               $host;
		proxy_set_header X-Real-IP          $remote_addr;
		proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host    $host;
		proxy_set_header X-Forwarded-Proto   $scheme;
		proxy_set_header Authorization      $http_authorization;
		proxy_set_header Connection         "";
		
		# Deliver SSE events as they arrive, and let xyOps return its own 401
		# errors. Never replay a tool request against another conductor.
		proxy_buffering off;
		proxy_cache off;
		gzip off;
		proxy_intercept_errors off;
		proxy_next_upstream off;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}
	
	# Bypass auth for static/public paths
	location ~ ^/(api|files|health|images|js|css|fonts|sounds|codemirror|manifest.webmanifest)(/|$) {
		proxy_pass http://backend;
	}
	
	# ---- the auth subrequest for protected routes ----
	location = /oauth2/auth {
		internal;
		proxy_pass http://oauth2_upstream;
		proxy_set_header Host              $host;
		proxy_set_header X-Original-URI    $request_uri;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Uri   $request_uri;
		proxy_pass_request_body off; # /auth only needs headers
		proxy_set_header Content-Length ""; 
	}
	
	# ---- proxy the oauth2-proxy app endpoints (/oauth2/*) ----
	# These handle sign_in/start/callback, cookie setting, etc.
	location /oauth2/ {
		proxy_pass http://oauth2_upstream;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
	
	# ---- your protected app ----
	location / {
		set $return_to "$scheme://$http_host$uri$is_args$args";
		
		# Check auth first
		auth_request /oauth2/auth;
		
		# If auth says 401, send user into the signin flow with return-to
		error_page 401 = @oauth2_signin;
		
		proxy_set_header Host               $host;
		proxy_set_header X-Real-IP          $remote_addr;
		proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host   $host;
		proxy_set_header X-Forwarded-Proto  $scheme;
		
		# hoist identity headers from the subrequest to the app
		auth_request_set $user   $upstream_http_x_auth_request_user;
		auth_request_set $email  $upstream_http_x_auth_request_email;
		auth_request_set $groups $upstream_http_x_auth_request_groups;
		auth_request_set $authz  $upstream_http_authorization;
		
		proxy_set_header X-Auth-Request-User   $user;
		proxy_set_header X-Auth-Request-Email  $email;
		proxy_set_header X-Auth-Request-Groups $groups;
		proxy_set_header Authorization         $authz;
		
		# Support for WebSockets
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 30s;
		proxy_send_timeout 30s;
		
		# Pass along to xyOps
		proxy_pass http://backend;
	}
	
	# Centralized redirect to login (preserves original URL)
	location @oauth2_signin {
		return 302 /oauth2/start?rd=$return_to;
	}
	
}
